name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Back-end (build e testes)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: back-end/escolarisapi

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: escolaris
          POSTGRES_USER: escolaris
          POSTGRES_PASSWORD: escolaris
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U escolaris -d escolaris"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/escolaris
      SPRING_DATASOURCE_USERNAME: escolaris
      SPRING_DATASOURCE_PASSWORD: escolaris

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Permissão do Maven Wrapper
        run: chmod +x mvnw

      - name: Build e testes
        run: ./mvnw -B verify

      - name: Publicar relatórios de teste
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: back-end/escolarisapi/target/surefire-reports
          if-no-files-found: ignore

  frontend:
    name: Front-end (build e testes)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: front-end/escolarisapp

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: front-end/escolarisapp/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Build
        run: npm run build

      - name: Testes
        run: npm test -- --no-watch --no-progress --browsers=ChromeHeadless
